name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチ / PR で新しいコミットが積まれたら、古い実行はキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ローカルのテスト環境（docker-compose.yml の db_test / backend/.env.test）と同じ値。
# 本番用のシークレットではないため、ここに直接定義してよい。
env:
  POSTGRES_DB: sns_test_db
  POSTGRES_USER: sns_test_user
  POSTGRES_PASSWORD: sns_test_password
  DATABASE_URL: postgres://sns_test_user:sns_test_password@localhost:5432/sns_test_db?sslmode=disable
  JWT_SECRET: test_jwt_secret_for_local_testing_only_32bytes
  JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_local_testing_32bytes
  FIREBASE_CREDENTIALS_JSON: "{}"
  FIREBASE_STORAGE_BUCKET: ""
  CORS_ORIGINS: http://localhost:5174,http://localhost:5173
  ENV: test
  # ローカル開発環境の Node.js と揃える
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # ジョブ1: バックエンド単体テスト
  # ============================================================
  backend-test:
    name: バックエンド単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sns_test_db
          POSTGRES_USER: sns_test_user
          POSTGRES_PASSWORD: sns_test_password
        ports:
          - 5432:5432
        # DB が接続を受け付けるまでジョブのステップは開始されない
        options: >-
          --health-cmd "pg_isready -U sns_test_user -d sns_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Go のセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # Go モジュール / ビルドキャッシュ（go.sum をキーにする）
          cache-dependency-path: backend/go.sum

      - name: 依存パッケージのダウンロード
        run: go mod download

      - name: DB マイグレーション
        run: go run ./cmd/migrate

      - name: テスト実行
        run: go test -v -parallel 2 -cover ./...

  # ============================================================
  # ジョブ2: フロントエンドビルド確認
  # ============================================================
  frontend-build:
    name: フロントエンドビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      # src/api/generated/ は gitignore 対象のため、コミット済みの openapi.yaml から生成する
      - name: OpenAPI 型生成
        run: npm run gen:api

      - name: ビルド
        run: npm run build

  # ============================================================
  # ジョブ3: E2E テスト（Playwright）
  # ============================================================
  e2e-test:
    name: E2E テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sns_test_db
          POSTGRES_USER: sns_test_user
          POSTGRES_PASSWORD: sns_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sns_test_user -d sns_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # ---------- バックエンド ----------
      - name: Go のセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: DB マイグレーション
        working-directory: backend
        run: go run ./cmd/migrate

      - name: API サーバーのビルド
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/api_server" ./cmd/server

      # frontend/.env.e2e の VITE_API_BASE_URL（:8081）に合わせて起動する
      - name: API サーバーをバックグラウンドで起動
        working-directory: backend
        env:
          PORT: "8081"
        run: nohup "$RUNNER_TEMP/api_server" > "$RUNNER_TEMP/api_server.log" 2>&1 &

      - name: API サーバーの起動待ち
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "API サーバーが起動しました（${i} 秒）"
              exit 0
            fi
            sleep 1
          done
          echo "API サーバーが 60 秒以内に起動しませんでした"
          cat "$RUNNER_TEMP/api_server.log"
          exit 1

      # ---------- フロントエンド ----------
      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存パッケージのインストール
        working-directory: frontend
        run: npm ci

      - name: OpenAPI 型生成
        working-directory: frontend
        run: npm run gen:api

      - name: Playwright のバージョン取得
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright ブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Playwright ブラウザのインストール
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # ブラウザ本体はキャッシュから復元できるが、OS の依存ライブラリは毎回入れる
      - name: Playwright の OS 依存ライブラリのインストール
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # フロントの dev サーバー（:5174）は playwright.config.ts の webServer が起動する
      - name: E2E テスト実行
        working-directory: frontend
        run: npx playwright test

      # ---------- 失敗時の調査用アーティファクト ----------
      - name: Playwright レポートのアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: スクリーンショット・トレースのアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: API サーバーログのアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-log
          path: ${{ runner.temp }}/api_server.log
          retention-days: 7
