    - current_password
    - new_email
    type: object
  github_com_atyahara_sns-backend_internal_dto.ChangePasswordRequest:
    properties:
      current_password:
        example: password123
        type: string
      new_password:
        example: newpassword123
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  github_com_atyahara_sns-backend_internal_dto.ErrorResponse:
    properties:
      code:
        example: INVALID_REQUEST
