securityDefinitions:
  BearerAuth:
    description: 'JWT Access Token を入力してください。形式: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: ユーザー認証（登録・ログイン・トークン管理）
  name: auth
- description: ユーザープロフィール・フォロー機能
  name: users
- description: 投稿のCRUDおよびコメント機能
  name: posts
- description: いいね・リポスト・ブックマーク機能
  name: interactions
- description: ユーザー・投稿・ハッシュタグ検索
  name: search
- description: アプリ内通知
  name: notifications
- description: 管理者専用機能（adminロールが必要）
  name: admin
