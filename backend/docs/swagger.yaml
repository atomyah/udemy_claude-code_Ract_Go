  github_com_atyahara_sns-backend_internal_dto.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/github_com_atyahara_sns-backend_internal_dto.UserResponse'
