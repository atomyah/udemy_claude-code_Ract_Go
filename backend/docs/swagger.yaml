  github_com_atyahara_sns-backend_internal_dto.AvatarResponse:
    properties:
      avatar_url:
        example: https://storage.googleapis.com/bucket/avatar.jpg
        type: string
    type: object
  github_com_atyahara_sns-backend_internal_dto.BannerResponse:
    properties:
      banner_url:
        example: https://storage.googleapis.com/bucket/banner.jpg
        type: string
