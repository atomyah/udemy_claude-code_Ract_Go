{{define "content"}}
<div class="login-wrap">
  <div class="card">
    <h1>管理画面ログイン</h1>
    {{with .Flash}}<div class="flash {{.Kind}}" role="status">{{.Message}}</div>{{end}}
    <form method="post" action="/admin/login" class="stack">
      <label>ユーザー名
        <input type="text" name="username" value="{{.Data.Username}}" autocomplete="username" required maxlength="50" autofocus>
      </label>
      <label>パスワード
        <input type="password" name="password" autocomplete="current-password" required maxlength="200">
      </label>
      <button type="submit" class="btn primary">ログイン</button>
    </form>
    <p class="hint">運営者専用の画面です。SNS アプリのアカウントではログインできません。</p>
  </div>
</div>
{{end}}
